name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          BOT_TOKEN=test
          ADMIN_IDS=1

          POSTGRES_DB=support_bot
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_HOST=db
          POSTGRES_PORT=5432

          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/support_bot
          REDIS_URL=redis://redis:6379/0

          REMNAWAVE_API_BASE_URL=https://example.com
          REMNAWAVE_API_TOKEN=test
          LOG_LEVEL=INFO
          EOF

      - name: Validate compose
        run: docker compose config

      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d db redis

      - name: Run migrations
        run: docker compose run --rm bot alembic upgrade head

      - name: Smoke test
        run: docker compose run --rm bot python -c "import bot; print('OK')"

      - name: Cleanup
        if: always()
        run: docker compose down -v
